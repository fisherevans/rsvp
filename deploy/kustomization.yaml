apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - namespace.yaml
    - pvc.yaml
    - service.yaml
    - deployment.yaml
    # secret.example.yaml is a template - the real Secret comes from a
    # Bitwarden-sourced configure step that the infra agent runs out of
    # band. Don't include it here so a `kubectl apply -k .` doesn't ship
    # placeholders into the cluster.
