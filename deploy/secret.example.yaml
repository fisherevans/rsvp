# Template only - do NOT commit a real Secret. Apply via `make configure-rsvp`
# (or the equivalent script in nottingham-cloud) that pulls the values from
# Bitwarden item `rsvp` and pipes them in.
#
# Required fields:
#   management-password : the shared password for the /manage portal
#   session-secret      : 32+ random bytes (hex) used to HMAC the session cookie
#
# Generate the session secret once:
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
    name: rsvp-secrets
    namespace: rsvp
type: Opaque
stringData:
    RSVP_MANAGEMENT_PASSWORD: 'REPLACE_ME'
    RSVP_SESSION_SECRET: 'REPLACE_ME_32_BYTES_HEX'
