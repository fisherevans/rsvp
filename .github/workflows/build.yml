# Builds the Docker image and pushes it to ghcr.io.
#
# Triggers:
#   - pushes to main          -> :main + :sha-<short> + :latest
#   - tags vX.Y.Z             -> :vX.Y.Z + :sha-<short>
#   - manual workflow_dispatch
#
# GITHUB_TOKEN with packages:write is the only credential needed.

name: build

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:
    # Weekly rebuild of the default branch on a fresh base (nottingham-cloud#800).
    # Publishes only the rolling tags (:main/:latest/:sha-*); a version tag
    # is never rebuilt, so a pinned deploy cannot move. See
    # nottingham-cloud agent/app-contract.md.
    schedule:
        - cron: '11 9 * * 6'

jobs:
    image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build + push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # Scheduled and manual rebuilds skip the layer cache and re-pull the
                  # base, or a cached `apk add`/`apt-get install` layer keeps the stale package.
                  pull: true
                  no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
